<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EXIF-Banner</title>
    <link rel="icon" type="image/svg+xml" href="/static/exif-banner-mark.svg" />
    <link rel="alternate icon" href="/static/exif-banner.ico" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brandMark" src="/static/exif-banner-mark.svg" alt="" />
        <div class="brandTextBlock">
          <strong>EXIF-Banner</strong>
          <div class="brandLine">
            <span id="statusText">等待扫描</span>
            <a href="https://github.com/stlin256/EXIF-Banner" target="_blank" rel="noreferrer">@stlin256</a>
          </div>
        </div>
      </div>
      <div class="pathbar">
        <input id="folderInput" type="text" value="" placeholder="选择相册文件夹" data-i18n-placeholder="placeholder.albumFolder" />
        <button id="pickFolderBtn" type="button" data-i18n="button.pickAlbum">选择相册</button>
        <label class="check"><input id="recursiveInput" type="checkbox" /> <span data-i18n="control.recursive">递归</span></label>
        <button id="scanBtn" type="button" data-i18n="button.scan">扫描</button>
      </div>
      <div class="actions">
        <button id="languageButton" class="languageButton" type="button" data-i18n-title="button.switchLanguage" data-i18n-aria-label="button.switchLanguage">
          <span id="languageIcon" class="languageIcon" aria-hidden="true"></span>
        </button>
        <button id="exportImagesBtn" type="button" disabled data-i18n="button.exportImages">导出图片</button>
        <button id="exportPptxBtn" type="button" disabled data-i18n="button.exportPptx">导出 PPTX</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="photoPanel">
        <div class="panelHead photoHead">
          <div>
            <span data-i18n="panel.photos">照片</span>
            <span id="countText">0/0</span>
            <div id="sortControl" class="sortControl">
              <button id="sortButton" class="sortButton" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="sort.dateAsc" data-i18n-aria-label="sort.dateAsc">
                <span id="sortIcon" class="sortIcon" aria-hidden="true"></span>
                <span id="sortChevron" class="sortChevron" aria-hidden="true"></span>
              </button>
              <div id="sortMenu" class="sortMenu" role="menu" hidden>
                <button class="sortMenuItem" type="button" role="menuitemradio" data-sort-mode="dateAsc">
                  <span class="sortMenuIcon" data-sort-icon="dateAsc" aria-hidden="true"></span>
                  <span data-i18n="sort.dateAsc">时间 ↑</span>
                </button>
                <button class="sortMenuItem" type="button" role="menuitemradio" data-sort-mode="dateDesc">
                  <span class="sortMenuIcon" data-sort-icon="dateDesc" aria-hidden="true"></span>
                  <span data-i18n="sort.dateDesc">时间 ↓</span>
                </button>
                <button class="sortMenuItem" type="button" role="menuitemradio" data-sort-mode="nameAsc">
                  <span class="sortMenuIcon" data-sort-icon="nameAsc" aria-hidden="true"></span>
                  <span data-i18n="sort.nameAsc">A-Z</span>
                </button>
                <button class="sortMenuItem" type="button" role="menuitemradio" data-sort-mode="nameDesc">
                  <span class="sortMenuIcon" data-sort-icon="nameDesc" aria-hidden="true"></span>
                  <span data-i18n="sort.nameDesc">Z-A</span>
                </button>
              </div>
            </div>
          </div>
          <div class="selectionActions">
            <button id="selectAllBtn" type="button" data-i18n="button.selectAll">全选</button>
            <button id="clearSelectionBtn" type="button" data-i18n="button.clear">清空</button>
          </div>
        </div>
        <div id="photoList" class="photoList"></div>
      </aside>

      <section class="previewPanel">
        <div class="previewStage" id="previewStage">
          <div class="emptyState" data-i18n="empty.preview">选择相册后开始预览</div>
          <div class="slideCanvas" id="slideCanvas" hidden>
            <img id="previewImage" alt="" />
            <div id="bannerPreview" class="bannerPreview">
              <div class="brandPreview" id="brandPreview">
                <img id="logoPreview" class="logoPreview" alt="" hidden />
                <span id="brandTextPreview">NIKON</span>
              </div>
              <div class="infoPreview">
                <div id="modelPreview">NIKON D500</div>
                <div id="lensPreview">AF-S DX VR Zoom-Nikkor 16-85mm</div>
              </div>
              <div class="paramsPreview" id="paramsPreview">16 mm&nbsp;&nbsp;&nbsp;&nbsp;F3.5&nbsp;&nbsp;&nbsp;&nbsp;1/400s&nbsp;&nbsp;&nbsp;&nbsp;ISO 280</div>
            </div>
            <div id="bannerEditLayer" class="bannerEditLayer" hidden>
              <div id="brandEditField" class="bannerEditable bannerBrandEditable" contenteditable="plaintext-only" spellcheck="false" tabindex="0" data-banner-field="brand"></div>
              <div id="modelEditField" class="bannerEditable bannerModelEditable" contenteditable="plaintext-only" spellcheck="false" tabindex="0" data-banner-field="model"></div>
              <div id="lensEditField" class="bannerEditable bannerLensEditable" contenteditable="plaintext-only" spellcheck="false" tabindex="0" data-banner-field="lens"></div>
              <div id="paramsEditField" class="bannerEditable bannerParamsEditable" contenteditable="plaintext-only" spellcheck="false" tabindex="0" data-banner-field="params"></div>
            </div>
          </div>
        </div>
        <div class="metaStrip">
          <span id="fileNameText">未选择</span>
          <span id="captureDateText"></span>
        </div>
      </section>

      <aside class="controlPanel">
        <div class="panelHead">
          <span data-i18n="panel.banner">横幅</span>
          <button id="resetBtn" type="button" data-i18n="button.reset">重置</button>
        </div>

        <label class="field">
          <span data-i18n="field.background">背景色</span>
          <input id="backgroundInput" type="color" value="#f6f4ef" />
        </label>
        <label class="field">
          <span data-i18n="field.bannerColor">横幅色</span>
          <input id="bannerColorInput" type="color" value="#000000" />
        </label>
        <label class="field pickerRow">
          <span data-i18n="field.logoPath">Logo 路径</span>
          <div class="pickerField">
            <input id="logoPathInput" type="text" placeholder="留空则按相机品牌自动匹配" data-i18n-placeholder="placeholder.logoPath" />
            <button id="pickLogoBtn" type="button" data-i18n="button.pickLogo">选择 Logo</button>
          </div>
        </label>
        <label class="field">
          <span data-i18n="field.brandText">品牌文字</span>
          <input id="brandTextInput" type="text" placeholder="留空则自动读取相机品牌" data-i18n-placeholder="placeholder.brandText" />
        </label>
        <div class="field actionRow">
          <span data-i18n="field.paramsText">参数内容</span>
          <button id="resetParamsTextBtn" type="button" data-i18n="button.resetParamsText">重置参数内容</button>
        </div>
        <label class="field">
          <span data-i18n="field.aspectRatio">底片比例</span>
          <select id="slideAspectRatioInput">
            <option value="16:9" selected>16:9</option>
            <option value="3:2">3:2</option>
            <option value="4:3">4:3</option>
            <option value="1:1">1:1</option>
            <option value="9:16">9:16</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="field.exportFormat">导出格式</span>
          <select id="exportFormatInput">
            <option value="jpeg" selected>JPEG</option>
            <option value="png">PNG</option>
          </select>
        </label>

        <div class="sliderGrid">
          <label>
            <span><span data-i18n="slider.bannerWidth">横幅宽度</span> <b id="bannerWidthValue">62.5%</b></span>
            <input id="bannerWidthInput" type="range" min="35" max="95" step="0.5" value="62.5" />
          </label>
          <label>
            <span><span data-i18n="slider.bannerHeight">横幅高度</span> <b id="bannerHeightValue">7.4%</b></span>
            <input id="bannerHeightInput" type="range" min="4" max="15" step="0.001" value="7.407" />
          </label>
          <label>
            <span><span data-i18n="slider.opacity">透明度</span> <b id="opacityValue">60%</b></span>
            <input id="opacityInput" type="range" min="10" max="95" step="1" value="60" />
          </label>
          <label>
            <span><span data-i18n="slider.marginX">左右页边距</span> <b id="pageMarginXValue">2.5%</b></span>
            <input id="pageMarginXInput" type="range" min="0" max="12" step="0.1" value="2.5" />
          </label>
          <label>
            <span><span data-i18n="slider.marginY">上下页边距</span> <b id="pageMarginYValue">1.85%</b></span>
            <input id="pageMarginYInput" type="range" min="0" max="15" step="0.05" value="1.85" />
          </label>
          <label>
            <span><span data-i18n="slider.gap">间距</span> <b id="gapValue">1.85%</b></span>
            <input id="gapInput" type="range" min="0" max="6" step="0.001" value="1.852" />
          </label>
          <label>
            <span><span data-i18n="slider.infoFont">机身/镜头字号</span> <b id="infoFontValue">2.04%</b></span>
            <input id="infoFontInput" type="range" min="1.2" max="3.8" step="0.001" value="2.037" />
          </label>
          <label>
            <span><span data-i18n="slider.paramFont">参数字号</span> <b id="paramFontValue">2.6%</b></span>
            <input id="paramFontInput" type="range" min="1.6" max="4.2" step="0.001" value="2.593" />
          </label>
          <label>
            <span><span data-i18n="slider.jpegQuality">JPEG 质量</span> <b id="qualityValue">92</b></span>
            <input id="qualityInput" type="range" min="70" max="100" step="1" value="92" />
          </label>
          <label>
            <span><span data-i18n="slider.exportScale">导出分辨率</span> <b id="exportScaleValue">100%</b></span>
            <input id="exportScaleInput" type="range" min="10" max="100" step="5" value="100" />
          </label>
        </div>

        <label class="check full"><input id="shadowInput" type="checkbox" checked /> <span data-i18n="control.shadow">图片阴影</span></label>

        <div class="cachePanel">
          <div class="panelSubhead">
            <span data-i18n="panel.cache">缓存</span>
            <button id="refreshCacheBtn" type="button" data-i18n="button.refreshCache">刷新</button>
          </div>
          <div class="cacheRows">
            <div>
              <span data-i18n="cache.preview">预览缓存</span>
              <b id="previewCacheText">-</b>
            </div>
            <div>
              <span data-i18n="cache.exif">EXIF 缓存</span>
              <b id="exifCacheText">-</b>
            </div>
          </div>
          <div class="cacheActions">
            <button id="clearPreviewCacheBtn" type="button" data-i18n="button.clearPreviewCache">清理预览</button>
            <button id="clearExifCacheBtn" type="button" data-i18n="button.clearExifCache">清理 EXIF</button>
          </div>
        </div>
      </aside>
    </main>

    <div id="busyOverlay" class="busyOverlay" aria-live="polite">
      <div class="busyPanel">
        <div class="shutterLoader" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span id="busyText" class="busyText">处理中</span>
        <div id="progressTrack" class="progressTrack" hidden>
          <div id="progressFill" class="progressFill"></div>
        </div>
        <span id="progressText" class="progressText" hidden>0%</span>
        <button id="cancelExportBtn" class="cancelExportBtn" type="button" data-i18n="button.cancelExport" hidden>取消导出</button>
      </div>
    </div>
    <div id="exportCompleteDialog" class="dialogOverlay" role="dialog" aria-modal="true" aria-labelledby="exportCompleteTitle" hidden>
      <div class="dialogPanel">
        <div class="dialogIcon" aria-hidden="true">✓</div>
        <h2 id="exportCompleteTitle" data-i18n="dialog.exportComplete">导出完成</h2>
        <p id="exportCompleteSummary" data-i18n="dialog.exportCompleteSummary">已完成导出</p>
        <div class="dialogPath">
          <span data-i18n="dialog.saveLocation">保存位置</span>
          <div id="exportCompletePath" class="pathValue"></div>
        </div>
        <div class="dialogActions">
          <button id="exportCompleteCloseBtn" type="button" data-i18n="button.done">完成</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/static/lucide-local.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
